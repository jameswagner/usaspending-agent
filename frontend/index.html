<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USASpending RAG</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
    line-height: 1.5;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
  #question {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  #ask-btn {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
  }
  #ask-btn:disabled { background: #999; cursor: default; }
  #status { margin-top: 14px; color: #888; font-size: 0.9rem; }
  #status.error { color: #b00020; }
  #answer { margin-top: 22px; }
  #answer table { border-collapse: collapse; margin: 10px 0; }
  #answer th, #answer td { border: 1px solid #ddd; padding: 5px 10px; text-align: left; }
  #answer th { background: #f5f5f5; }
  #source-type {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.75rem;
    color: #666;
    background: #f0f0f0;
    padding: 2px 8px;
    border-radius: 10px;
  }
  #charts-container { margin-top: 24px; }
  .chart-box { max-width: 640px; margin-bottom: 28px; }
  #citations {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #eee;
    font-size: 0.85rem;
    color: #555;
  }
  #citations h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; margin-bottom: 6px; }
  #citations li { margin-bottom: 3px; }
</style>
</head>
<body>
  <h1>USASpending RAG assistant</h1>
  <div class="subtitle">Ask about federal spending — definitions from the Analyst's Guide, or live numbers from USASpending.gov.</div>

  <input type="text" id="question" placeholder="e.g. What is a sub-award? / How is NSF spending broken down by NAICS code for FY2024?" autofocus>
  <br>
  <button id="ask-btn">Ask</button>

  <div id="status"></div>
  <div id="answer"></div>
  <span id="source-type" style="display:none;"></span>

  <div id="charts-container"></div>

  <div id="citations" style="display:none;">
    <h3>Sources</h3>
    <ul id="citations-list"></ul>
  </div>

<script>
  const questionInput = document.getElementById('question');
  const askBtn = document.getElementById('ask-btn');
  const statusEl = document.getElementById('status');
  const answerEl = document.getElementById('answer');
  const sourceTypeEl = document.getElementById('source-type');
  const chartsContainer = document.getElementById('charts-container');
  const citationsBlock = document.getElementById('citations');
  const citationsList = document.getElementById('citations-list');
  let chartInstances = [];

  async function ask() {
    const question = questionInput.value.trim();
    if (!question) return;

    askBtn.disabled = true;
    statusEl.className = '';
    statusEl.textContent = 'Thinking...';
    answerEl.innerHTML = '';
    sourceTypeEl.style.display = 'none';
    citationsBlock.style.display = 'none';
    citationsList.innerHTML = '';
    chartInstances.forEach(c => c.destroy());
    chartInstances = [];
    chartsContainer.innerHTML = '';

    try {
      const resp = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
      const data = await resp.json();

      statusEl.textContent = '';
      answerEl.innerHTML = marked.parse(data.answer_text);

      sourceTypeEl.textContent = data.source_type;
      sourceTypeEl.style.display = 'inline-block';

      if (data.citations && data.citations.length) {
        citationsList.innerHTML = data.citations
          .map(c => `<li>${c.source}, page ${c.page}</li>`)
          .join('');
        citationsBlock.style.display = 'block';
      }

      (data.charts || []).forEach(chart => {
        const box = document.createElement('div');
        box.className = 'chart-box';
        const canvas = document.createElement('canvas');
        box.appendChild(canvas);
        chartsContainer.appendChild(box);

        chartInstances.push(new Chart(canvas, {
          type: chart.chart_type,
          data: {
            labels: chart.labels,
            datasets: [{ label: chart.title, data: chart.values }],
          },
          options: {
            responsive: true,
            plugins: { title: { display: true, text: chart.title } },
          },
        }));
      });
    } catch (err) {
      statusEl.className = 'error';
      statusEl.textContent = err.message;
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener('click', ask);
  questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
