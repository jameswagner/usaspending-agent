[project]
name = "usaspending-rag"
version = "0.1.0"
description = "RAG assistant for USASpending.gov"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "" } ]
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langsmith>=0.12.1",
    "nltk>=3.10.3",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.52.4",
    "whoosh>=2.7.4",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
