[project]
name = "usaspending-rag"
version = "0.1.0"
description = "RAG assistant for USASpending.gov"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "" } ]
license = "MIT"
dependencies = [
    "anthropic>=1.3.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.12.1",
    "nltk>=3.10.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.52.4",
    "whoosh>=2.7.4",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
